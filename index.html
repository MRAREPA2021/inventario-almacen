<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén de Repuestos - Búsqueda de Inventario</title>
    
    <!-- Tailwind CSS para diseño responsive y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        heinz: {
                            red: '#DA291C', // Rojo corporativo
                            dark: '#B12015',
                            light: '#fdeae8'
                        }
                    }
                }
            }
        }
    </script>

    <!-- SheetJS: Para leer archivos Excel (.xlsx) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- MiniSearch: Motor de búsqueda en memoria ultrarrápido -->
    <script src="https://cdn.jsdelivr.net/npm/minisearch@6.1.0/dist/umd/index.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <!-- Encabezado corporativo -->
    <header class="bg-heinz-red text-white p-4 shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Ícono de engranaje -->
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide">Almacén de Repuestos</h1>
            </div>
            <span class="hidden sm:inline bg-white text-heinz-red px-3 py-1 rounded-full text-sm font-semibold shadow">
                Consulta Rápida
            </span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Panel de Carga y Búsqueda -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
            
            <div class="flex flex-col md:flex-row gap-4 mb-6 items-center">
                <div class="w-full md:w-1/3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Cargar base de datos (MAESTRO.xlsx)</label>
                    <input type="file" id="file-upload" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-heinz-light file:text-heinz-red hover:file:bg-red-100 cursor-pointer"/>
                </div>
                
                <div class="w-full md:w-2/3">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Buscar Repuesto</label>
                    <input type="text" id="search-box" disabled placeholder="Sube el archivo Excel primero..." class="w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-heinz-red focus:border-heinz-red disabled:bg-gray-100 disabled:cursor-not-allowed">
                </div>
            </div>

            <div id="status" class="text-sm font-medium text-gray-600">Esperando archivo MAESTRO.xlsx...</div>
        </div>

        <!-- Tabla de Resultados (Se adapta a móvil como tarjetas) -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <!-- Vista Escritorio -->
            <div class="hidden md:block overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 uppercase text-xs tracking-wider">
                            <th class="p-4 border-b">Código</th>
                            <th class="p-4 border-b">Descripción</th>
                            <th class="p-4 border-b">Texto Búsqueda</th>
                            <th class="p-4 border-b">Ubicación</th>
                            <th class="p-4 border-b text-right">Stock</th>
                            <th class="p-4 border-b text-right">Stock Seg.</th>
                        </tr>
                    </thead>
                    <tbody id="results-table" class="text-sm divide-y divide-gray-200">
                        <tr><td colspan="6" class="p-4 text-center text-gray-500">No hay resultados</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Vista Móvil (Tarjetas) -->
            <div id="results-cards" class="md:hidden flex flex-col divide-y divide-gray-200">
                <div class="p-4 text-center text-gray-500 text-sm">No hay resultados</div>
            </div>
        </div>
    </main>

    <script>
        // Configuración de MiniSearch basada en las columnas de tu MAESTRO.xlsx
        const miniSearch = new MiniSearch({
            fields: ['2º nº de artículo', 'Descripción', 'Texto de búsqueda', 'Ubicación'], 
            storeFields: ['2º nº de artículo', 'Descripción', 'Texto de búsqueda', 'Ubicación', 'Cantidad existencias', 'Inventario seguridad'],
            searchOptions: {
                boost: { '2º nº de artículo': 3, 'Descripción': 2 }, // Dar prioridad si se busca por código exacto
                prefix: true,
                fuzzy: 0.15
            }
        });

        let inventario = [];

        // Lógica para leer el archivo Excel
        document.getElementById('file-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('status').innerText = "Procesando las 26,000 filas...";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    // Leer la primera hoja
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    
                    // Convertir a JSON
                    const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    // Asegurar que cada fila tenga un 'id' único para MiniSearch
                    inventario = rawJson.map((row, index) => {
                        row.id = index;
                        return row;
                    });

                    miniSearch.removeAll();
                    miniSearch.addAll(inventario);
                    
                    document.getElementById('status').innerHTML = `<span class="text-green-600">✓ Excel cargado: ${inventario.length.toLocaleString()} repuestos indexados.</span>`;
                    
                    const searchBox = document.getElementById('search-box');
                    searchBox.disabled = false;
                    searchBox.placeholder = "Buscar por código, descripción o ubicación...";
                    searchBox.focus();

                    renderResults(inventario.slice(0, 100)); // Mostrar los primeros 100 por defecto
                } catch (error) {
                    document.getElementById('status').innerHTML = `<span class="text-heinz-red">Error al leer el archivo Excel. Asegúrate de que es válido.</span>`;
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Lógica de búsqueda
        document.getElementById('search-box').addEventListener('input', function(e) {
            const query = e.target.value;
            if (query.trim() === "") {
                renderResults(inventario.slice(0, 100)); // Si está vacío, mostrar 100
                return;
            }
            
            // Buscar y limitar a 100 resultados para no colapsar la vista
            const results = miniSearch.search(query).slice(0, 100);
            renderResults(results);
        });

        // Función para inyectar los resultados en la interfaz (Escritorio y Móvil)
        function renderResults(items) {
            const tableBody = document.getElementById('results-table');
            const cardsContainer = document.getElementById('results-cards');
            
            if (items.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">No se encontraron repuestos</td></tr>`;
                cardsContainer.innerHTML = `<div class="p-4 text-center text-gray-500 text-sm">No se encontraron repuestos</div>`;
                return;
            }

            let tableHTML = '';
            let cardsHTML = '';

            items.forEach(item => {
                const code = item['2º nº de artículo'] || 'N/A';
                const desc = item['Descripción'] || '-';
                const textBusq = item['Texto de búsqueda'] || '-';
                const location = item['Ubicación'] || 'Sin ubicar';
                const stock = item['Cantidad existencias'] !== "" ? item['Cantidad existencias'] : 0;
                const safeStock = item['Inventario seguridad'] !== "" ? item['Inventario seguridad'] : 0;
                
                // Colorear stock en rojo si es menor o igual al de seguridad
                const stockClass = stock <= safeStock ? 'text-heinz-red font-bold' : 'text-gray-900';

                // Desktop Row
                tableHTML += `
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="p-4 border-b font-mono font-medium">${code}</td>
                        <td class="p-4 border-b font-semibold text-gray-800">${desc}</td>
                        <td class="p-4 border-b text-gray-500 text-xs">${textBusq}</td>
                        <td class="p-4 border-b">
                            <span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs font-semibold">${location}</span>
                        </td>
                        <td class="p-4 border-b text-right text-lg ${stockClass}">${stock}</td>
                        <td class="p-4 border-b text-right text-gray-500">${safeStock}</td>
                    </tr>
                `;

                // Mobile Card
                cardsHTML += `
                    <div class="p-4 hover:bg-gray-50 transition-colors">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="font-mono text-sm font-medium text-gray-600">${code}</span>
                                <h3 class="font-bold text-gray-900 leading-tight">${desc}</h3>
                            </div>
                            <div class="text-right ml-2">
                                <div class="text-2xl leading-none ${stockClass}">${stock}</div>
                                <div class="text-[10px] text-gray-500 uppercase tracking-wide">Stock</div>
                            </div>
                        </div>
                        <div class="flex justify-between items-end mt-3">
                            <span class="bg-gray-200 text-gray-700 px-2 py-1 rounded text-xs font-semibold">📍 ${location}</span>
                            <div class="text-xs text-gray-500">Min: ${safeStock}</div>
                        </div>
                    </div>
                `;
            });

            tableBody.innerHTML = tableHTML;
            cardsContainer.innerHTML = cardsHTML;
        }
    </script>
</body>
</html>
